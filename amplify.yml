version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify injects console environment variables into the build container
        # only — the SSR compute that runs /api/* never sees them. Writing them
        # to .env.production before `next build` is how they reach the runtime.
        - >-
          env | grep -E
          '^(OPENAI_API_KEY|OPENAI_CHAT_MODEL|FIRECRAWL_API_KEY|RESEND_API_KEY|RESEND_FROM_EMAIL|RESEND_TO_EMAIL|NEXT_PUBLIC_SITE_URL)='
          >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
