version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify injects console environment variables into the build container
        # only — the SSR compute that runs /api/* never sees them. Writing them
        # to .env.production before `next build` is how they reach the runtime.
        - >-
          env | grep -E
          '^(OPENAI_API_KEY|OPENAI_CHAT_MODEL|FIRECRAWL_API_KEY|RESEND_API_KEY|RESEND_FROM_EMAIL|RESEND_TO_EMAIL|NEXT_PUBLIC_SITE_URL)='
          >> .env.production || true
        # Names and lengths only — never the values, build logs are readable.
        - 'if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY: set (${#OPENAI_API_KEY} chars)"; else echo "OPENAI_API_KEY: MISSING from build env"; fi'
        - 'echo "written to .env.production:" $(cut -d= -f1 .env.production 2>/dev/null | tr "\n" " ")'
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
